if:
  condition:
    lambda: return id(user_is_interacting);
  then:
    - lvgl.label.update:
        id: lvgl_valve_${hass_climate_id}_target_label
        text: !lambda |-
          const float target = static_cast<int>(x);
          char buffer[32];
          snprintf(buffer, sizeof(buffer), "%.0f C", target);
          return buffer;
    - homeassistant.action:
        action: climate.set_temperature
        data:
          entity_id: climate.${hass_climate_id}
          temperature: !lambda return static_cast<int>(x);