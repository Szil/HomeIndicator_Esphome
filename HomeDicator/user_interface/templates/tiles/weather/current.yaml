                    text_color: 0xababab
                    text_font: libreFranklin14
                    text_align: CENTER
                    text: "--:--"
                - label:
                    id: weather_forecast_2_icon_label
                    width: 138
                    height: 28
                    text_color: 0xeebf41
                    text_font: weather_forecast_icons
                    text_align: CENTER
                    text: "\U000F0026"
                - label:
                    id: weather_forecast_2_temperature_label
                    width: 138
                    height: 24
                    text_color: 0xffffff
                    text_font: libreFranklin18
                    text_align: CENTER
                    text: "--"
          - obj:
              width: 140
              height: 92
              radius: 12
              bg_color: 0x272727
              bg_opa: COVER
              pad_all: 0
              layout:
                type: FLEX
                flex_flow: COLUMN
                flex_align_main: CENTER
                flex_align_cross: CENTER
                pad_row: 0
              widgets:
                - label:
