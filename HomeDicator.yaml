substitutions:
  # -----------------------
  # ADJUST DEVICE NAME HERE
  # -----------------------
  device_name: "homedicator-development"
  device_friendly_name: "HomeDicator Development"

  # ------------------
  # ENTER API KEY HERE
  # ------------------
  api_key: !secret homedicator_api_key

  # ----------------------------------------------------------------------------------------------------
  # ADJUST TOTAL NUMBER OF PAGES HERE
  # Is used to generate navigation dots and their logic (set it to your pages + 1 for the settings page)
  # ----------------------------------------------------------------------------------------------------
  total_pages: "4"

  heater_entity: "heatermain_house_heating"
  # These must exactly match the preset_modes reported by the climate entity.
  heater_preset_comfort: "comfort"
  heater_preset_eco: "eco"
  heater_preset_home: "home"

  # --------------
  # OTHER SETTINGS
  # --------------
  page_transition_time: 150ms # How long to animate the transition between pages.
  user_interface_debug_mode: "false" # Draws borders around objects and labels for layouting

packages:
  HomeDicator: !include HomeDicator/device/sdl.yaml

sensor:
  # -----------------------------------------------------------------------
  # ADD YOUR SENSORS HERE
  # Because of the way ESPHOME works lights, thermostats, etc also go here
  # They need to be included here in order for the display to update values.
  # -----------------------------------------------------------------------

  - !include
      file: HomeDicator/core/templates/sensor.yaml
      vars:
        hass_sensor_id: "airgradient_schlafzimmer_temperature" # You can ommit the "sensor."

  - !include
      file: HomeDicator/core/templates/sensor.yaml
      vars:
        hass_sensor_id: "airgradient_schlafzimmer_senseair_co2_value" # You can ommit the "sensor."

  - !include
      file: HomeDicator/core/templates/sensor.yaml
      vars:
        hass_sensor_id: "airgradient_schlafzimmer_particulate_matter_1_0_m_concentration" # You can ommit the "sensor."

  - !include
      file: HomeDicator/core/templates/climate_sensor_wide.yaml
      vars:
        hass_climate_id: "schlafzimmer_schreibtisch" # You can ommit the "climate."

  - !include
      file: HomeDicator/core/templates/climate_sensor.yaml
      vars:
        hass_climate_id: "wohnzimmer_fenster_links" # You can ommit the "climate."

  - !include
      file: HomeDicator/core/templates/climate_sensor.yaml
      vars:
        hass_climate_id: "kuche" # You can ommit the "climate."

  - !include
      file: HomeDicator/core/templates/climate_sensor_wide.yaml
      vars:
        hass_climate_id: "badezimmer_fenster" # You can ommit the "climate."

  - platform: homeassistant
    id: heater_target_temperature
    entity_id: climate.${heater_entity}
    attribute: temperature
    on_value:
      then:
        - script.execute: refresh_heater_display

text_sensor:
  - platform: homeassistant
    id: heater_entity_state
    entity_id: climate.${heater_entity}
    on_value:
      then:
        - script.execute: refresh_heater_display

  - platform: homeassistant
    id: heater_hvac_action
    entity_id: climate.${heater_entity}
    attribute: hvac_action
    on_value:
      then:
        - script.execute: refresh_heater_display

  - platform: homeassistant
    id: heater_preset_mode
    entity_id: climate.${heater_entity}
    attribute: preset_mode
    on_value:
      then:
        - script.execute: refresh_heater_display

script:
  - id: refresh_heater_display
    then:
      - if:
          condition:
            lambda: |-
              const std::string &state = id(heater_entity_state).state;
              return state.empty() || state == "unknown" || state == "unavailable";
          then:
            - lvgl.label.update:
                id: heater_status_label
                text: "Unavailable"
            - lvgl.label.update:
                id: heater_target_label
                text: "Unavailable"
            - lvgl.label.update:
                id: heater_preset_label
                text: "Preset: unavailable"
            - lvgl.widget.update:
                id: heater_target_arc
                state:
                  disabled: true
          else:
            - lvgl.label.update:
                id: heater_status_label
                text: !lambda |-
                  const std::string &action = id(heater_hvac_action).state;
                  if (action == "heating") return "Heating";
                  if (action == "idle") return "Idle";
                  if (action == "off") return "Off";
                  if (action == "cooling") return "Cooling";
                  if (action == "drying") return "Drying";
                  if (action == "fan") return "Fan";
                  if (action == "defrosting") return "Defrosting";
                  return "Unknown";
            - lvgl.label.update:
                id: heater_preset_label
                text: !lambda |-
                  const std::string &preset = id(heater_preset_mode).state;
                  if (preset.empty() || preset == "unknown" || preset == "unavailable") return "Preset: —";
                  if (preset == "none") return "Preset: None";
                  if (preset == "${heater_preset_comfort}") return "Preset: Comfort";
                  if (preset == "${heater_preset_eco}") return "Preset: Eco";
                  if (preset == "${heater_preset_home}") return "Preset: Home";
                  return "Preset: " + preset;
            - if:
                condition:
                  lambda: return std::isfinite(id(heater_target_temperature).state);
                then:
                  - lvgl.label.update:
                      id: heater_target_label
                      text: !lambda |-
                        char buffer[20];
                        snprintf(buffer, sizeof(buffer), "%.1f °C", id(heater_target_temperature).state);
                        return buffer;
                  - lvgl.arc.update:
                      id: heater_target_arc
                      value: !lambda |-
                        const float target = id(heater_target_temperature).state;
                        return target < 5.0f ? 5.0f : target > 25.0f ? 25.0f : target;
                  - lvgl.widget.update:
                      id: heater_target_arc
                      state:
                        disabled: false
                else:
                  - lvgl.label.update:
                      id: heater_target_label
                      text: "Loading…"
                  - lvgl.widget.update:
                      id: heater_target_arc
                      state:
                        disabled: true



binary_sensor:
  # ---------------------
  # ADD YOUR SENSORS HERE
  # ---------------------


switch:
  # ----------------------
  # ADD YOUR SWITCHES HERE
  # ----------------------



lvgl:
  pages:
    # ----------------------------
    # ADD / ADJUST YOUR PAGES HERE
    # ----------------------------
    - id: heater_page
      bg_opa: TRANSP
      widgets:
        - !include
            file: HomeDicator/user_interface/templates/page_title.yaml
            vars:
              title: "Thermostat"
        - !include
            file: HomeDicator/user_interface/templates/tiles/thermostat/preset_panel.yaml
            vars:
              heater_entity: ${heater_entity}
              preset_comfort: ${heater_preset_comfort}
              preset_eco: ${heater_preset_eco}
              preset_home: ${heater_preset_home}
    - id: first_page
      bg_opa: TRANSP
      widgets:
        - !include
            file: HomeDicator/user_interface/templates/page_title.yaml
            vars:
              title: "Temperature" # CHANGE PAGE TITLE HERE
        - obj:
            styles: content_container
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: LV_FLEX_ALIGN_START
              flex_align_cross: CENTER
            widgets:
              - !include
                  file: HomeDicator/user_interface/templates/tiles/thermostat/wide_half_height.yaml
                  vars:
                    color: 0xeebf41
                    hass_climate_id: "schlafzimmer_schreibtisch"
                    min_value: 5
                    max_value: 25
                    unit: "°C"
                    icon: "\U000F08A0"
              - !include
                  file: HomeDicator/user_interface/templates/tiles/thermostat/square.yaml
                  vars:
                    color: 0xeebf41
                    hass_climate_id: "wohnzimmer_fenster_links"
                    min_value: 5
                    max_value: 25
                    unit: "°C"
                    title: "Living Room"
              - !include
                  file: HomeDicator/user_interface/templates/tiles/thermostat/square.yaml
                  vars:
                    color: 0xeebf41
                    hass_climate_id: "kuche"
                    min_value: 5
                    max_value: 25
                    unit: "°C"
                    title: "Kittchen"
              - !include
                  file: HomeDicator/user_interface/templates/tiles/thermostat/wide_half_height.yaml
                  vars:
                    color: 0xeebf41
                    hass_climate_id: "badezimmer_fenster"
                    min_value: 5
                    max_value: 25
                    unit: "°C"
                    icon: "\U000F1819"
    - id: second_page
      bg_opa: TRANSP
      widgets:
        - !include
            file: HomeDicator/user_interface/templates/page_title.yaml
            vars:
              title: "Sensors" # CHANGE PAGE TITLE HERE
        - obj:
            styles: content_container
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: LV_FLEX_ALIGN_START
              flex_align_cross: CENTER
            widgets:
              - !include
                  file: HomeDicator/user_interface/templates/tiles/sensor/square.yaml
                  vars:
                    color: 0xeebf41
                    hass_sensor_id: "airgradient_schlafzimmer_temperature"
                    icon: "\U000F0F55"
                    unit: "°C"
                    title: "Bedroom"
              - !include
                  file: HomeDicator/user_interface/templates/tiles/sensor/square.yaml
                  vars:
                    color: 0xeebf41
                    hass_sensor_id: "airgradient_schlafzimmer_senseair_co2_value"
                    icon: "\U000F07E4"
                    unit: "ppm"
                    title: "Bedroom"
              - !include
                  file: HomeDicator/user_interface/templates/tiles/sensor/wide.yaml
                  vars:
                    color: 0xeebf41
                    hass_sensor_id: "airgradient_schlafzimmer_particulate_matter_1_0_m_concentration"
                    icon: "\U000F013B"
                    unit: "µg/m³"
                    title: "Bedroom"
