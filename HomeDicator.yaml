substitutions:
  # -----------------------
  # ADJUST DEVICE NAME HERE
  # -----------------------
  device_name: "homedicator-development"
  device_friendly_name: "HomeDicator Development"

  # ------------------
  # ENTER API KEY HERE
  # ------------------
  api_key: !secret homedicator_api_key

  # ----------------------------------------------------------------------------------------------------
  # ADJUST TOTAL NUMBER OF PAGES HERE
  # Is used to generate navigation dots and their logic (set it to your pages + 1 for the settings page)
  # ----------------------------------------------------------------------------------------------------
  total_pages: "5"

  weather_entity: "weather.forecast_home"
  heater_entity: "heatermain_house_heating"
  # These must exactly match the preset_modes reported by the climate entity.
  heater_preset_comfort: "comfort"
  heater_preset_eco: "eco"
  heater_preset_home: "home"

  # --------------
  # OTHER SETTINGS
  # --------------
  page_transition_time: 150ms # How long to animate the transition between pages.
  user_interface_debug_mode: "false" # Draws borders around objects and labels for layouting

packages:
  HomeDicator: !include HomeDicator/device/sdl.yaml

sensor:
  # -----------------------------------------------------------------------
  # ADD YOUR SENSORS HERE
  # Because of the way ESPHOME works lights, thermostats, etc also go here
  # They need to be included here in order for the display to update values.
  # -----------------------------------------------------------------------

  - !include
      file: HomeDicator/core/templates/sensor.yaml
      vars:
        hass_sensor_id: "airgradient_schlafzimmer_temperature" # You can ommit the "sensor."

  - !include
      file: HomeDicator/core/templates/sensor.yaml
      vars:
        hass_sensor_id: "airgradient_schlafzimmer_senseair_co2_value" # You can ommit the "sensor."

  - !include
      file: HomeDicator/core/templates/sensor.yaml
      vars:
        hass_sensor_id: "airgradient_schlafzimmer_particulate_matter_1_0_m_concentration" # You can ommit the "sensor."

  - !include
      file: HomeDicator/core/templates/climate_sensor_wide.yaml
      vars:
        hass_climate_id: "schlafzimmer_schreibtisch" # You can ommit the "climate."

  - !include
      file: HomeDicator/core/templates/climate_sensor.yaml
      vars:
        hass_climate_id: "wohnzimmer_fenster_links" # You can ommit the "climate."

  - !include
      file: HomeDicator/core/templates/climate_sensor.yaml
      vars:
        hass_climate_id: "kuche" # You can ommit the "climate."

  - !include
      file: HomeDicator/core/templates/climate_sensor_wide.yaml
      vars:
        hass_climate_id: "badezimmer_fenster" # You can ommit the "climate."

  - platform: homeassistant
    id: heater_target_temperature
    entity_id: climate.${heater_entity}
    attribute: temperature
    on_value:
      then:
        - script.execute: refresh_heater_display

  - platform: homeassistant
    id: weather_temperature
    entity_id: ${weather_entity}
    attribute: temperature
    on_value:
      then:
        - script.execute: refresh_weather_display

  - platform: homeassistant
    id: weather_humidity
    entity_id: ${weather_entity}
    attribute: humidity
    on_value:
      then:
        - script.execute: refresh_weather_display

  - platform: homeassistant
    id: weather_wind_speed
    entity_id: ${weather_entity}
    attribute: wind_speed
    on_value:
      then:
        - script.execute: refresh_weather_display

text_sensor:
  - platform: homeassistant
    id: heater_entity_state
    entity_id: climate.${heater_entity}
    on_value:
      then:
        - script.execute: refresh_heater_display

  - platform: homeassistant
    id: heater_hvac_action
    entity_id: climate.${heater_entity}
    attribute: hvac_action
    on_value:
      then:
        - script.execute: refresh_heater_display

  - platform: homeassistant
    id: heater_preset_mode
    entity_id: climate.${heater_entity}
    attribute: preset_mode
    on_value:
      then:
        - script.execute: refresh_heater_display

  - platform: homeassistant
    id: weather_condition
    entity_id: ${weather_entity}
    on_value:
      then:
        - script.execute: refresh_weather_display

  - platform: homeassistant
    id: weather_temperature_unit
    entity_id: ${weather_entity}
    attribute: temperature_unit
    on_value:
      then:
        - script.execute: refresh_weather_display

  - platform: homeassistant
    id: weather_wind_speed_unit
    entity_id: ${weather_entity}
    attribute: wind_speed_unit
    on_value:
      then:
        - script.execute: refresh_weather_display

script:
  - id: refresh_weather_display
    then:
      - lvgl.label.update:
          id: weather_condition_label
          text: !lambda |-
            const std::string &condition = id(weather_condition).state;
            if (condition == "clear-night") return "Clear Night";
            if (condition == "cloudy") return "Cloudy";
            if (condition == "exceptional") return "Exceptional";
            if (condition == "fog") return "Fog";
            if (condition == "hail") return "Hail";
            if (condition == "lightning") return "Lightning";
            if (condition == "lightning-rainy") return "Thunderstorms and Rain";
            if (condition == "partlycloudy") return "Partly Cloudy";
            if (condition == "pouring") return "Pouring Rain";
            if (condition == "rainy") return "Rainy";
            if (condition == "snowy") return "Snowy";
            if (condition == "snowy-rainy") return "Snow and Rain";
            if (condition == "sunny") return "Sunny";
            if (condition == "windy") return "Windy";
            if (condition == "windy-variant") return "Windy and Cloudy";
            return "Unavailable";
      - lvgl.label.update:
          id: weather_icon_label
          text: !lambda |-
            const std::string &condition = id(weather_condition).state;
            if (condition == "clear-night") return "\U000F0594";
            if (condition == "cloudy") return "\U000F0590";
            if (condition == "fog") return "\U000F0591";
            if (condition == "hail") return "\U000F0592";
            if (condition == "lightning") return "\U000F0593";
            if (condition == "lightning-rainy") return "\U000F067E";
            if (condition == "partlycloudy") return "\U000F0595";
            if (condition == "pouring") return "\U000F0596";
            if (condition == "rainy") return "\U000F0597";
            if (condition == "snowy") return "\U000F0598";
            if (condition == "snowy-rainy") return "\U000F067F";
            if (condition == "sunny") return "\U000F0599";
            if (condition == "windy") return "\U000F059D";
            if (condition == "windy-variant") return "\U000F059E";
            return "\U000F0026";
      - if:
          condition:
            lambda: |-
              const std::string &state = id(weather_condition).state;
              return state.empty() || state == "unknown" || state == "unavailable";
          then:
            - lvgl.label.update:
                id: weather_condition_label
                text: "Unavailable"
      - if:
          condition:
            lambda: |-
              const std::string &state = id(weather_condition).state;
              return !state.empty() && state != "unknown" && state != "unavailable" && std::isfinite(id(weather_temperature).state);
          then:
            - lvgl.label.update:
                id: weather_temperature_label
                text: !lambda |-
                  const std::string &unit = id(weather_temperature_unit).state;
                  char buffer[24];
                  if (unit.empty() || unit == "unknown" || unit == "unavailable") {
                    snprintf(buffer, sizeof(buffer), "%.1f ?", id(weather_temperature).state);
                  } else {
                    snprintf(buffer, sizeof(buffer), "%.1f %s", id(weather_temperature).state, unit.c_str());
                  }
                  return buffer;
          else:
            - lvgl.label.update:
                id: weather_temperature_label
                text: "--"
      - lvgl.label.update:
          id: weather_humidity_label
          text: !lambda |-
            const std::string &state = id(weather_condition).state;
            if (state.empty() || state == "unknown" || state == "unavailable" || !std::isfinite(id(weather_humidity).state)) return "Humidity --";
            char buffer[24];
            snprintf(buffer, sizeof(buffer), "Humidity %.0f%%", id(weather_humidity).state);
            return buffer;
      - lvgl.label.update:
          id: weather_wind_label
          text: !lambda |-
            const std::string &state = id(weather_condition).state;
            if (state.empty() || state == "unknown" || state == "unavailable" || !std::isfinite(id(weather_wind_speed).state)) return "Wind --";
            const std::string &unit = id(weather_wind_speed_unit).state;
            char buffer[32];
            if (unit.empty() || unit == "unknown" || unit == "unavailable") {
              snprintf(buffer, sizeof(buffer), "Wind %.1f ?", id(weather_wind_speed).state);
            } else {
              snprintf(buffer, sizeof(buffer), "Wind %.1f %s", id(weather_wind_speed).state, unit.c_str());
            }
            return buffer;

  - id: refresh_heater_display
    then:
      - if:
          condition:
            lambda: |-
              const std::string &state = id(heater_entity_state).state;
              return state.empty() || state == "unknown" || state == "unavailable";
          then:
            - lvgl.label.update:
                id: heater_status_label
                text: "Unavailable"
            - lvgl.label.update:
                id: heater_target_label
                text: "Unavailable"
            - lvgl.label.update:
                id: heater_preset_label
                text: "Preset: unavailable"
            - lvgl.widget.update:
                id: heater_target_arc
                state:
                  disabled: true
          else:
            - lvgl.label.update:
                id: heater_status_label
                text: !lambda |-
                  const std::string &action = id(heater_hvac_action).state;
                  if (action == "heating") return "Heating";
                  if (action == "idle") return "Idle";
                  if (action == "off") return "Off";
                  if (action == "cooling") return "Cooling";
                  if (action == "drying") return "Drying";
                  if (action == "fan") return "Fan";
                  if (action == "defrosting") return "Defrosting";
                  return "Unknown";
            - lvgl.label.update:
                id: heater_preset_label
                text: !lambda |-
                  const std::string &preset = id(heater_preset_mode).state;
                  if (preset.empty() || preset == "unknown" || preset == "unavailable") return "Preset: —";
                  if (preset == "none") return "Preset: None";
                  if (preset == "${heater_preset_comfort}") return "Preset: Comfort";
                  if (preset == "${heater_preset_eco}") return "Preset: Eco";
                  if (preset == "${heater_preset_home}") return "Preset: Home";
                  return "Preset: " + preset;
            - if:
                condition:
                  lambda: return std::isfinite(id(heater_target_temperature).state);
                then:
                  - lvgl.label.update:
                      id: heater_target_label
                      text: !lambda |-
                        char buffer[20];
                        snprintf(buffer, sizeof(buffer), "%.1f °C", id(heater_target_temperature).state);
                        return buffer;
                  - lvgl.arc.update:
                      id: heater_target_arc
                      value: !lambda |-
                        const float target = id(heater_target_temperature).state;
                        return target < 5.0f ? 5.0f : target > 25.0f ? 25.0f : target;
                  - lvgl.widget.update:
                      id: heater_target_arc
                      state:
                        disabled: false
                else:
                  - lvgl.label.update:
                      id: heater_target_label
                      text: "Loading…"
                  - lvgl.widget.update:
                      id: heater_target_arc
                      state:
                        disabled: true



binary_sensor:
  # ---------------------
  # ADD YOUR SENSORS HERE
  # ---------------------


switch:
  # ----------------------
  # ADD YOUR SWITCHES HERE
  # ----------------------



lvgl:
  pages:
    # ----------------------------
    # ADD / ADJUST YOUR PAGES HERE
    # ----------------------------
    - id: weather_page
      bg_opa: TRANSP
      widgets:
        - !include
            file: HomeDicator/user_interface/templates/page_title.yaml
            vars:
              title: "Weather"
        - !include HomeDicator/user_interface/templates/tiles/weather/current.yaml
    - id: heater_page
      bg_opa: TRANSP
      widgets:
        - !include
            file: HomeDicator/user_interface/templates/page_title.yaml
            vars:
              title: "Thermostat"
        - !include
            file: HomeDicator/user_interface/templates/tiles/thermostat/preset_panel.yaml
            vars:
              heater_entity: ${heater_entity}
              preset_comfort: ${heater_preset_comfort}
              preset_eco: ${heater_preset_eco}
              preset_home: ${heater_preset_home}
    - id: first_page
      bg_opa: TRANSP
      widgets:
        - !include
            file: HomeDicator/user_interface/templates/page_title.yaml
            vars:
              title: "Temperature" # CHANGE PAGE TITLE HERE
        - obj:
            styles: content_container
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: LV_FLEX_ALIGN_START
              flex_align_cross: CENTER
            widgets:
              - !include
                  file: HomeDicator/user_interface/templates/tiles/thermostat/wide_half_height.yaml
                  vars:
                    color: 0xeebf41
                    hass_climate_id: "schlafzimmer_schreibtisch"
                    min_value: 5
                    max_value: 25
                    unit: "°C"
                    icon: "\U000F08A0"
              - !include
                  file: HomeDicator/user_interface/templates/tiles/thermostat/square.yaml
                  vars:
                    color: 0xeebf41
                    hass_climate_id: "wohnzimmer_fenster_links"
                    min_value: 5
                    max_value: 25
                    unit: "°C"
                    title: "Living Room"
              - !include
                  file: HomeDicator/user_interface/templates/tiles/thermostat/square.yaml
                  vars:
                    color: 0xeebf41
                    hass_climate_id: "kuche"
                    min_value: 5
                    max_value: 25
                    unit: "°C"
                    title: "Kittchen"
              - !include
                  file: HomeDicator/user_interface/templates/tiles/thermostat/wide_half_height.yaml
                  vars:
                    color: 0xeebf41
                    hass_climate_id: "badezimmer_fenster"
                    min_value: 5
                    max_value: 25
                    unit: "°C"
                    icon: "\U000F1819"
    - id: second_page
      bg_opa: TRANSP
      widgets:
        - !include
            file: HomeDicator/user_interface/templates/page_title.yaml
            vars:
              title: "Sensors" # CHANGE PAGE TITLE HERE
        - obj:
            styles: content_container
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: LV_FLEX_ALIGN_START
              flex_align_cross: CENTER
            widgets:
              - !include
                  file: HomeDicator/user_interface/templates/tiles/sensor/square.yaml
                  vars:
                    color: 0xeebf41
                    hass_sensor_id: "airgradient_schlafzimmer_temperature"
                    icon: "\U000F0F55"
                    unit: "°C"
                    title: "Bedroom"
              - !include
                  file: HomeDicator/user_interface/templates/tiles/sensor/square.yaml
                  vars:
                    color: 0xeebf41
                    hass_sensor_id: "airgradient_schlafzimmer_senseair_co2_value"
                    icon: "\U000F07E4"
                    unit: "ppm"
                    title: "Bedroom"
              - !include
                  file: HomeDicator/user_interface/templates/tiles/sensor/wide.yaml
                  vars:
                    color: 0xeebf41
                    hass_sensor_id: "airgradient_schlafzimmer_particulate_matter_1_0_m_concentration"
                    icon: "\U000F013B"
                    unit: "µg/m³"
                    title: "Bedroom"
