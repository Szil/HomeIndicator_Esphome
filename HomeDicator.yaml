substitutions:
  # -----------------------
  # ADJUST DEVICE NAME HERE
  # -----------------------
  device_name: "homedicator-development"
  device_friendly_name: "HomeDicator Development"

  # ------------------
  # ENTER API KEY HERE
  # ------------------
  api_key: !secret homedicator_api_key

  # ----------------------------------------------------------------------------------------------------
  # ADJUST TOTAL NUMBER OF PAGES HERE
  # Is used to generate navigation dots and their logic (set it to your pages + 1 for the settings page)
  # ----------------------------------------------------------------------------------------------------
  total_pages: "5"

  weather_entity: "weather.forecast_home"
  heater_entity: "heatermain_house_heating"
  # These must exactly match the preset_modes reported by the climate entity.
  heater_preset_comfort: "comfort"
  heater_preset_eco: "eco"
  heater_preset_home: "home"

  # --------------
  # OTHER SETTINGS
  # --------------
  page_transition_time: 150ms # How long to animate the transition between pages.
  user_interface_debug_mode: "false" # Draws borders around objects and labels for layouting

globals:
  - id: weather_forecast_1_time
    type: std::string
    restore_value: no
    initial_value: '"--:--"'
  - id: weather_forecast_1_icon
    type: std::string
    restore_value: no
    initial_value: '"\U000F0026"'
  - id: weather_forecast_1_temperature
    type: std::string
    restore_value: no
    initial_value: '"--"'
  - id: weather_forecast_2_time
    type: std::string
    restore_value: no
    initial_value: '"--:--"'
  - id: weather_forecast_2_icon
    type: std::string
    restore_value: no
    initial_value: '"\U000F0026"'
  - id: weather_forecast_2_temperature
    type: std::string
    restore_value: no
    initial_value: '"--"'
  - id: weather_forecast_3_time
    type: std::string
    restore_value: no
    initial_value: '"--:--"'
  - id: weather_forecast_3_icon
    type: std::string
    restore_value: no
    initial_value: '"\U000F0026"'
  - id: weather_forecast_3_temperature
    type: std::string
    restore_value: no
    initial_value: '"--"'

packages:
  HomeDicator: !include HomeDicator/device/sdl.yaml

sensor:
  # -----------------------------------------------------------------------
  # ADD YOUR SENSORS HERE
  # Because of the way ESPHOME works lights, thermostats, etc also go here
  # They need to be included here in order for the display to update values.
  # -----------------------------------------------------------------------

  - !include
      file: HomeDicator/core/templates/sensor.yaml
      vars:
        hass_sensor_id: "airgradient_schlafzimmer_temperature" # You can ommit the "sensor."

  - !include
      file: HomeDicator/core/templates/sensor.yaml
      vars:
        hass_sensor_id: "airgradient_schlafzimmer_senseair_co2_value" # You can ommit the "sensor."

  - !include
      file: HomeDicator/core/templates/sensor.yaml
      vars:
        hass_sensor_id: "airgradient_schlafzimmer_particulate_matter_1_0_m_concentration" # You can ommit the "sensor."

  - !include
      file: HomeDicator/core/templates/valve_temperature.yaml
      vars:
        hass_climate_id: "valve2"
        attribute: "current_temperature"
        sensor_suffix: "current_temperature"

  - !include
      file: HomeDicator/core/templates/valve_temperature.yaml
      vars:
        hass_climate_id: "valve2"
        attribute: "temperature"
        sensor_suffix: "target_temperature"

  - !include
      file: HomeDicator/core/templates/valve_temperature.yaml
      vars:
        hass_climate_id: "valve1"
        attribute: "current_temperature"
        sensor_suffix: "current_temperature"

  - !include
      file: HomeDicator/core/templates/valve_temperature.yaml
      vars:
        hass_climate_id: "valve1"
        attribute: "temperature"
        sensor_suffix: "target_temperature"

  - !include
      file: HomeDicator/core/templates/valve_temperature.yaml
      vars:
        hass_climate_id: "valve3"
        attribute: "current_temperature"
        sensor_suffix: "current_temperature"

  - !include
      file: HomeDicator/core/templates/valve_temperature.yaml
      vars:
        hass_climate_id: "valve3"
        attribute: "temperature"
        sensor_suffix: "target_temperature"

  - platform: homeassistant
    id: heater_target_temperature
    entity_id: climate.${heater_entity}
    attribute: temperature
    on_value:
      then:
        - script.execute: refresh_heater_display

  - platform: homeassistant
    id: weather_temperature
    entity_id: ${weather_entity}
    attribute: temperature
    on_value:
      then:
        - script.execute: refresh_weather_display

  - platform: homeassistant
    id: weather_humidity
    entity_id: ${weather_entity}
    attribute: humidity
    on_value:
      then:
        - script.execute: refresh_weather_display

  - platform: homeassistant
    id: weather_wind_speed
    entity_id: ${weather_entity}
    attribute: wind_speed
    on_value:
      then:
        - script.execute: refresh_weather_display

text_sensor:
  - !include
      file: HomeDicator/core/templates/valve_state.yaml
      vars:
        hass_climate_id: "valve2"

  - !include
      file: HomeDicator/core/templates/valve_state.yaml
      vars:
        hass_climate_id: "valve1"

  - !include
      file: HomeDicator/core/templates/valve_state.yaml
      vars:
        hass_climate_id: "valve3"

  - platform: homeassistant
    id: heater_entity_state
    entity_id: climate.${heater_entity}
    on_value:
      then:
        - script.execute: refresh_heater_display

  - platform: homeassistant
    id: heater_hvac_action
    entity_id: climate.${heater_entity}
    attribute: hvac_action
    on_value:
      then:
        - script.execute: refresh_heater_display

  - platform: homeassistant
    id: heater_preset_mode
    entity_id: climate.${heater_entity}
    attribute: preset_mode
    on_value:
      then:
        - script.execute: refresh_heater_display

  - platform: homeassistant
    id: weather_condition
    entity_id: ${weather_entity}
    on_value:
      then:
        - script.execute: refresh_weather_display

  - platform: homeassistant
    id: weather_friendly_name
    entity_id: ${weather_entity}
    attribute: friendly_name
    on_value:
      then:
        - script.execute: refresh_weather_display

  - platform: homeassistant
    id: weather_temperature_unit
    entity_id: ${weather_entity}
    attribute: temperature_unit
    on_value:
      then:
        - script.execute: refresh_weather_display

  - platform: homeassistant
    id: weather_wind_speed_unit
    entity_id: ${weather_entity}
    attribute: wind_speed_unit
    on_value:
      then:
        - script.execute: refresh_weather_display

interval:
  - interval: 1h
    then:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - script.execute: fetch_weather_forecast

script:
  - !include
      file: HomeDicator/core/templates/refresh_valve_display.yaml
      vars:
        hass_climate_id: "valve2"

  - !include
      file: HomeDicator/core/templates/refresh_valve_display.yaml
      vars:
        hass_climate_id: "valve1"

  - !include
      file: HomeDicator/core/templates/refresh_valve_display.yaml
      vars:
        hass_climate_id: "valve3"

  - id: refresh_weather_display
    then:
      - lvgl.label.update:
          id: weather_location_label
          text: !lambda |-
            const std::string &name = id(weather_friendly_name).state;
            if (name.empty() || name == "unknown" || name == "unavailable") return "Forecast location unavailable";
            return name.c_str();
      - lvgl.label.update:
          id: weather_condition_label
          text: !lambda |-
            const std::string &condition = id(weather_condition).state;
            if (condition == "clear-night") return "Clear Night";
            if (condition == "cloudy") return "Cloudy";
            if (condition == "exceptional") return "Exceptional";
            if (condition == "fog") return "Fog";
            if (condition == "hail") return "Hail";
            if (condition == "lightning") return "Lightning";
            if (condition == "lightning-rainy") return "Thunderstorms and Rain";
            if (condition == "partlycloudy") return "Partly Cloudy";
            if (condition == "pouring") return "Pouring Rain";
            if (condition == "rainy") return "Rainy";
            if (condition == "snowy") return "Snowy";
            if (condition == "snowy-rainy") return "Snow and Rain";
            if (condition == "sunny") return "Sunny";
            if (condition == "windy") return "Windy";
            if (condition == "windy-variant") return "Windy and Cloudy";
            return "Unavailable";
      - lvgl.label.update:
          id: weather_icon_label
          text: !lambda |-
            const std::string &condition = id(weather_condition).state;
            if (condition == "clear-night") return "\U000F0594";
            if (condition == "cloudy") return "\U000F0590";
            if (condition == "fog") return "\U000F0591";
            if (condition == "hail") return "\U000F0592";
            if (condition == "lightning") return "\U000F0593";
            if (condition == "lightning-rainy") return "\U000F067E";
            if (condition == "partlycloudy") return "\U000F0595";
            if (condition == "pouring") return "\U000F0596";
            if (condition == "rainy") return "\U000F0597";
            if (condition == "snowy") return "\U000F0598";
            if (condition == "snowy-rainy") return "\U000F067F";
            if (condition == "sunny") return "\U000F0599";
            if (condition == "windy") return "\U000F059D";
            if (condition == "windy-variant") return "\U000F059E";
            return "\U000F0026";
      - if:
          condition:
            lambda: |-
              const std::string &state = id(weather_condition).state;
              return state.empty() || state == "unknown" || state == "unavailable";
          then:
            - lvgl.label.update:
                id: weather_condition_label
                text: "Unavailable"
      - if:
          condition:
            lambda: |-
              const std::string &state = id(weather_condition).state;
              return !state.empty() && state != "unknown" && state != "unavailable" && std::isfinite(id(weather_temperature).state);
          then:
            - lvgl.label.update:
                id: weather_temperature_label
                text: !lambda |-
                  const std::string &unit = id(weather_temperature_unit).state;
                  char buffer[24];
                  if (unit.empty() || unit == "unknown" || unit == "unavailable") {
                    snprintf(buffer, sizeof(buffer), "%.1f ?", id(weather_temperature).state);
                  } else {
                    snprintf(buffer, sizeof(buffer), "%.1f %s", id(weather_temperature).state, unit.c_str());
                  }
                  return buffer;
          else:
            - lvgl.label.update:
                id: weather_temperature_label
                text: "--"
      - lvgl.label.update:
          id: weather_humidity_label
          text: !lambda |-
            const std::string &state = id(weather_condition).state;
            if (state.empty() || state == "unknown" || state == "unavailable" || !std::isfinite(id(weather_humidity).state)) return "Humidity --";
            char buffer[24];
            snprintf(buffer, sizeof(buffer), "Humidity %.0f%%", id(weather_humidity).state);
            return buffer;
      - lvgl.label.update:
          id: weather_wind_label
          text: !lambda |-
            const std::string &state = id(weather_condition).state;
            if (state.empty() || state == "unknown" || state == "unavailable" || !std::isfinite(id(weather_wind_speed).state)) return "Wind --";
            const std::string &unit = id(weather_wind_speed_unit).state;
            char buffer[32];
            if (unit.empty() || unit == "unknown" || unit == "unavailable") {
              snprintf(buffer, sizeof(buffer), "Wind %.1f ?", id(weather_wind_speed).state);
            } else {
              snprintf(buffer, sizeof(buffer), "Wind %.1f %s", id(weather_wind_speed).state, unit.c_str());
            }
            return buffer;

  - id: refresh_weather_forecast_display
    then:
      - lambda: |-
          ESP_LOGD("weather", "Refreshing forecast display labels");
      - lvgl.label.update:
          id: weather_forecast_1_time_label
          text: !lambda return id(weather_forecast_1_time).c_str();
      - lvgl.label.update:
          id: weather_forecast_1_icon_label
          text: !lambda return id(weather_forecast_1_icon).c_str();
      - lvgl.label.update:
          id: weather_forecast_1_temperature_label
          text: !lambda return id(weather_forecast_1_temperature).c_str();
      - lvgl.label.update:
          id: weather_forecast_2_time_label
          text: !lambda return id(weather_forecast_2_time).c_str();
      - lvgl.label.update:
          id: weather_forecast_2_icon_label
          text: !lambda return id(weather_forecast_2_icon).c_str();
      - lvgl.label.update:
          id: weather_forecast_2_temperature_label
          text: !lambda return id(weather_forecast_2_temperature).c_str();
      - lvgl.label.update:
          id: weather_forecast_3_time_label
          text: !lambda return id(weather_forecast_3_time).c_str();
      - lvgl.label.update:
          id: weather_forecast_3_icon_label
          text: !lambda return id(weather_forecast_3_icon).c_str();
      - lvgl.label.update:
          id: weather_forecast_3_temperature_label
          text: !lambda return id(weather_forecast_3_temperature).c_str();

  - id: clear_weather_forecast
    then:
      - lambda: |-
          id(weather_forecast_1_time) = "--:--";
          id(weather_forecast_1_icon) = "\U000F0026";
          id(weather_forecast_1_temperature) = "--";
          id(weather_forecast_2_time) = "--:--";
          id(weather_forecast_2_icon) = "\U000F0026";
          id(weather_forecast_2_temperature) = "--";
          id(weather_forecast_3_time) = "--:--";
          id(weather_forecast_3_icon) = "\U000F0026";
          id(weather_forecast_3_temperature) = "--";
      - script.execute: refresh_weather_forecast_display

  - id: fetch_weather_forecast
    then:
      - lambda: |-
          ESP_LOGI("weather", "Requesting hourly forecast for ${weather_entity}");
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${weather_entity}
            type: hourly
          capture_response: true
          response_template: |-
            {% set forecasts = response['${weather_entity}']['forecast'] %}
            {% set ns = namespace(items=[]) %}
            {% for item in forecasts[:3] %}
            {% set ns.items = ns.items + [{
              'time': as_local(as_datetime(item['datetime'])).strftime('%H:%M'),
              'condition': item.get('condition', ''),
              'temperature': item.get('temperature', none)
            }] %}
            {% endfor %}
            {{ {'forecast': ns.items} | to_json }}
          on_success:
            - lambda: |-
                ESP_LOGI("weather", "on_success callback executed");
                const JsonVariantConst response_data = response["response"];
                ESP_LOGD("weather", "Template response key present: %s; value is string: %s",
                    response_data.isNull() ? "no" : "yes",
                    response_data.is<std::string>() ? "yes" : "no");
                const std::string forecast_json = response_data.as<std::string>();
                ESP_LOGI("weather", "Response template output (%u bytes): %s",
                    static_cast<unsigned>(forecast_json.size()), forecast_json.c_str());
                auto set_unavailable = []() {
                  id(weather_forecast_1_time) = "--:--";
                  id(weather_forecast_1_icon) = "\U000F0026";
                  id(weather_forecast_1_temperature) = "--";
                  id(weather_forecast_2_time) = "--:--";
                  id(weather_forecast_2_icon) = "\U000F0026";
                  id(weather_forecast_2_temperature) = "--";
                  id(weather_forecast_3_time) = "--:--";
                  id(weather_forecast_3_icon) = "\U000F0026";
                  id(weather_forecast_3_temperature) = "--";
                };
                size_t parsed_forecast_count = 0;
                bool forecast_array_found = false;
                const bool parsed = json::parse_json(forecast_json, [&](JsonObject root) -> bool {
                  JsonArray forecasts = root["forecast"].as<JsonArray>();
                  if (forecasts.isNull()) {
                    ESP_LOGW("weather", "JSON parsed, but 'forecast' is missing or not an array");
                    return false;
                  }
                  forecast_array_found = true;
                  parsed_forecast_count = forecasts.size();
                  auto icon_for = [](const std::string &condition) -> const char * {
                    if (condition == "clear-night") return "\U000F0594";
                    if (condition == "cloudy") return "\U000F0590";
                    if (condition == "fog") return "\U000F0591";
                    if (condition == "hail") return "\U000F0592";
                    if (condition == "lightning") return "\U000F0593";
                    if (condition == "lightning-rainy") return "\U000F067E";
                    if (condition == "partlycloudy") return "\U000F0595";
                    if (condition == "pouring") return "\U000F0596";
                    if (condition == "rainy") return "\U000F0597";
                    if (condition == "snowy") return "\U000F0598";
                    if (condition == "snowy-rainy") return "\U000F067F";
                    if (condition == "sunny") return "\U000F0599";
                    if (condition == "windy") return "\U000F059D";
                    if (condition == "windy-variant") return "\U000F059E";
                    return "\U000F0026";
                  };
                  auto set_forecast = [&](size_t index, std::string &time, std::string &icon, std::string &temperature) {
                    if (index >= forecasts.size()) {
                      time = "--:--";
                      icon = "\U000F0026";
                      temperature = "--";
                      return;
                    }
                    JsonObject item = forecasts[index].as<JsonObject>();
                    if (item.isNull()) {
                      time = "--:--";
                      icon = "\U000F0026";
                      temperature = "--";
                      return;
                    }
                    time = item["time"].as<std::string>();
                    if (time.empty() || time == "unknown") time = "--:--";
                    icon = icon_for(item["condition"].as<std::string>());
                    JsonVariantConst value = item["temperature"];
                    if (value.isNull() || (!value.is<float>() && !value.is<int>())) {
                      temperature = "--";
                      return;
                    }
                    const float degrees = value.as<float>();
                    if (!std::isfinite(degrees)) {
                      temperature = "--";
                      return;
                    }
                    const std::string &unit = id(weather_temperature_unit).state;
                    char buffer[24];
                    if (unit.empty() || unit == "unknown" || unit == "unavailable") {
                      snprintf(buffer, sizeof(buffer), "%.0f ?", degrees);
                    } else {
                      snprintf(buffer, sizeof(buffer), "%.1f%s", degrees, unit.c_str());
                    }
                    temperature = buffer;
                  };
                  set_forecast(0, id(weather_forecast_1_time), id(weather_forecast_1_icon), id(weather_forecast_1_temperature));
                  set_forecast(1, id(weather_forecast_2_time), id(weather_forecast_2_icon), id(weather_forecast_2_temperature));
                  set_forecast(2, id(weather_forecast_3_time), id(weather_forecast_3_icon), id(weather_forecast_3_temperature));
                  return true;
                });
                ESP_LOGI("weather", "JSON parsing result: %s; forecast array found: %s; item count: %u",
                    parsed ? "success" : "failure",
                    forecast_array_found ? "yes" : "no",
                    static_cast<unsigned>(parsed_forecast_count));
                if (!parsed) set_unavailable();
                ESP_LOGD("weather", "Forecast values for display: [%s, %s], [%s, %s], [%s, %s]",
                    id(weather_forecast_1_time).c_str(), id(weather_forecast_1_temperature).c_str(),
                    id(weather_forecast_2_time).c_str(), id(weather_forecast_2_temperature).c_str(),
                    id(weather_forecast_3_time).c_str(), id(weather_forecast_3_temperature).c_str());
                id(refresh_weather_forecast_display).execute();
          on_error:
            - lambda: |-
                ESP_LOGE("weather", "on_error callback executed: %s", error.c_str());
            - script.execute: clear_weather_forecast

  - id: refresh_heater_display
    then:
      - if:
          condition:
            lambda: |-
              const std::string &state = id(heater_entity_state).state;
              return state.empty() || state == "unknown" || state == "unavailable";
          then:
            - lvgl.label.update:
                id: heater_status_label
                text: "Unavailable"
            - lvgl.label.update:
                id: heater_target_label
                text: "Unavailable"
            - lvgl.label.update:
                id: heater_preset_label
                text: "Preset: unavailable"
            - lvgl.widget.update:
                id: heater_target_arc
                state:
                  disabled: true
          else:
            - lvgl.label.update:
                id: heater_status_label
                text: !lambda |-
                  const std::string &action = id(heater_hvac_action).state;
                  if (action == "heating") return "Heating";
                  if (action == "idle") return "Idle";
                  if (action == "off") return "Off";
                  if (action == "cooling") return "Cooling";
                  if (action == "drying") return "Drying";
                  if (action == "fan") return "Fan";
                  if (action == "defrosting") return "Defrosting";
                  return "Unknown";
            - lvgl.label.update:
                id: heater_preset_label
                text: !lambda |-
                  const std::string &preset = id(heater_preset_mode).state;
                  if (preset.empty() || preset == "unknown" || preset == "unavailable") return "Preset: —";
                  if (preset == "none") return "Preset: None";
                  if (preset == "${heater_preset_comfort}") return "Preset: Comfort";
                  if (preset == "${heater_preset_eco}") return "Preset: Eco";
                  if (preset == "${heater_preset_home}") return "Preset: Home";
                  return "Preset: " + preset;
            - if:
                condition:
                  lambda: return std::isfinite(id(heater_target_temperature).state);
                then:
                  - lvgl.label.update:
                      id: heater_target_label
                      text: !lambda |-
                        char buffer[20];
                        snprintf(buffer, sizeof(buffer), "%.1f °C", id(heater_target_temperature).state);
                        return buffer;
                  - lvgl.arc.update:
                      id: heater_target_arc
                      value: !lambda |-
                        const float target = id(heater_target_temperature).state;
                        return target < 5.0f ? 5.0f : target > 25.0f ? 25.0f : target;
                  - lvgl.widget.update:
                      id: heater_target_arc
                      state:
                        disabled: false
                else:
                  - lvgl.label.update:
                      id: heater_target_label
                      text: "Loading…"
                  - lvgl.widget.update:
                      id: heater_target_arc
                      state:
                        disabled: true



binary_sensor:
  # ---------------------
  # ADD YOUR SENSORS HERE
  # ---------------------


switch:
  # ----------------------
  # ADD YOUR SWITCHES HERE
  # ----------------------



lvgl:
  pages:
    # ----------------------------
    # ADD / ADJUST YOUR PAGES HERE
    # ----------------------------
    - id: weather_page
      bg_opa: TRANSP
      widgets:
        - !include
            file: HomeDicator/user_interface/templates/page_title.yaml
            vars:
              title: "Weather"
        - !include HomeDicator/user_interface/templates/tiles/weather/current.yaml
    - id: heater_page
      bg_opa: TRANSP
      widgets:
        - !include
            file: HomeDicator/user_interface/templates/page_title.yaml
            vars:
              title: "Thermostat"
        - !include
            file: HomeDicator/user_interface/templates/tiles/thermostat/preset_panel.yaml
            vars:
              heater_entity: ${heater_entity}
              preset_comfort: ${heater_preset_comfort}
              preset_eco: ${heater_preset_eco}
              preset_home: ${heater_preset_home}
    - id: first_page
      bg_opa: TRANSP
      widgets:
        - !include
            file: HomeDicator/user_interface/templates/page_title.yaml
            vars:
              title: "Valves"
        - obj:
            styles: content_container
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: LV_FLEX_ALIGN_START
              flex_align_cross: CENTER
            widgets:
              - !include
                  file: HomeDicator/user_interface/templates/tiles/thermostat/valve_square.yaml
                  vars:
                    color: 0xeebf41
                    hass_climate_id: "valve2"
                    title: "Bedroom"
                    min_value: 5
                    max_value: 25
              - !include
                  file: HomeDicator/user_interface/templates/tiles/thermostat/valve_square.yaml
                  vars:
                    color: 0xeebf41
                    hass_climate_id: "valve1"
                    title: "Bedroom1"
                    min_value: 5
                    max_value: 25
              - !include
                  file: HomeDicator/user_interface/templates/tiles/thermostat/valve_square.yaml
                  vars:
                    color: 0xeebf41
                    hass_climate_id: "valve3"
                    title: "Attic"
                    min_value: 5
                    max_value: 25
              - !include
